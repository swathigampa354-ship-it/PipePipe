name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace -DskipFormatKtlint
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: PipePipe-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Commit arm64 APK to repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/*arm64-v8a*.apk apk/PipePipe-arm64-v8a-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/PipePipe-arm64-v8a-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m 'build: add Android arm64 debug APK [skip ci]'
            git push
          fi
